# Render Blueprint for the MoTech auth API (server/).
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# A persistent disk is required because users/meters are stored in a JSON file (paid "starter" plan or higher).
services:
  - type: web
    name: motech-auth-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: motech-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://dashboard.motechenergyembedded.com
      - key: COOKIE_SECURE
        value: "true"
      # api.<domain> and dashboard.<domain> are the same site, so strict cookies work.
      - key: COOKIE_SAMESITE
        value: strict
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_FILE
        value: /var/data/store.json
      # No SMS gateway yet: password reset by SMS stays off until you set SMS_MODE=webhook + SMS_WEBHOOK_URL.
      - key: SMS_MODE
        value: disabled
      # Used only by the one-off "npm run seed" command in the Render shell.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
